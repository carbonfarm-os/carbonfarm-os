openapi: 3.1.0
info:
  title: Bank mock – ghi có tiền bán tín chỉ
  description: 'Bank mock – ghi có tiền bán tín chỉ vào tài khoản hợp tác xã. KHÔNG xử lý tiền thật, không kết nối ngân hàng
    nào.


    Tài khoản tự mở ở lần ghi có đầu tiên. Ghi có idempotent theo mã tham chiếu (gửi lại không cộng hai lần).

    '
  version: 0.1.0
paths:
  /suc-khoe:
    get:
      tags:
        - Hệ thống
      summary: Suc Khoe
      operationId: suc_khoe_suc_khoe_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Suc Khoe Suc Khoe Get
  /ghi-co:
    post:
      tags:
        - Tài khoản
      summary: Ghi Co
      operationId: ghi_co_ghi_co_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GhiCo'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiaoDich'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - khoaConnector: []
  /tai-khoan/{so_tai_khoan}:
    get:
      tags:
        - Tài khoản
      summary: Xem
      operationId: xem_tai_khoan__so_tai_khoan__get
      security:
        - khoaConnector: []
      parameters:
        - name: so_tai_khoan
          in: path
          required: true
          schema:
            type: string
            title: So Tai Khoan
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaiKhoan'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    GhiCo:
      properties:
        so_tai_khoan:
          type: string
          pattern: ^\d{8,19}$
          title: So Tai Khoan
        so_tien_vnd:
          type: integer
          exclusiveMinimum: 0.0
          title: So Tien Vnd
        noi_dung:
          type: string
          maxLength: 200
          minLength: 3
          title: Noi Dung
        ma_tham_chieu:
          type: string
          minLength: 8
          title: Ma Tham Chieu
      type: object
      required:
        - so_tai_khoan
        - so_tien_vnd
        - noi_dung
        - ma_tham_chieu
      title: GhiCo
    GiaoDich:
      properties:
        ma_tham_chieu:
          type: string
          title: Ma Tham Chieu
        so_tai_khoan:
          type: string
          title: So Tai Khoan
        so_tien_vnd:
          type: integer
          title: So Tien Vnd
        noi_dung:
          type: string
          title: Noi Dung
        luc:
          type: string
          title: Luc
      type: object
      required:
        - ma_tham_chieu
        - so_tai_khoan
        - so_tien_vnd
        - noi_dung
        - luc
      title: GiaoDich
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TaiKhoan:
      properties:
        so_tai_khoan:
          type: string
          title: So Tai Khoan
        so_du_vnd:
          type: integer
          title: So Du Vnd
        giao_dich:
          items:
            $ref: '#/components/schemas/GiaoDich'
          type: array
          title: Giao Dich
      type: object
      required:
        - so_tai_khoan
        - so_du_vnd
        - giao_dich
      title: TaiKhoan
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
  securitySchemes:
    khoaConnector:
      type: http
      scheme: bearer
