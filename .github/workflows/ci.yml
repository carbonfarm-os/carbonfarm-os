# CI trên mọi PR vào main: task check (SPDX + compose) và task lint.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}  # tránh giới hạn API khi tải go-task
      - name: Công cụ lint
        run: pip install yamllint ruff -r connectors/requirements.txt
      - name: task check
        run: task check
      - name: task lint
        run: task lint
      - name: task test
        run: task test

  web:
    # Web Tầng 2 (SvelteKit): cài theo lockfile, svelte-check, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: domains/carbon/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: domains/carbon/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
