# Tầng 1 – dịch vụ lõi tổng quát, không chứa nghiệp vụ. Image gốc, ghim phiên bản; giấy phép ở DEPENDENCIES.md.
# Thứ tự khởi động: openbao → openbao-khoi-tao (sinh bí mật ra volume bimat) → postgres → keycloak → apisix.
# Mật khẩu dịch vụ không nằm trong .env: OpenBao sinh và giữ, dịch vụ đọc qua tệp /run/bimat/<tên>.
services:
  openbao:
    image: openbao/openbao:${OPENBAO_TAG:-2.7.2}
    command: ["server", "-config=/openbao/cau-hinh/config.hcl"]
    volumes:
      - ../platform/openbao/config.hcl:/openbao/cau-hinh/config.hcl:ro
      - bao-du-lieu:/openbao/file
    ports:
      - "127.0.0.1:${OPENBAO_PORT:-8200}:8200"   # UI quản trị, chỉ máy dev
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200 || exit 1"]
      interval: 3s
      retries: 30

  openbao-khoi-tao:
    image: openbao/openbao:${OPENBAO_TAG:-2.7.2}
    entrypoint: ["/bin/sh", "/khoi-tao.sh"]
    user: "0"   # chỉ dịch vụ chạy một lần này ghi volume bimat; dịch vụ khác mount chỉ đọc
    environment:
      BAO_ADDR: http://openbao:8200
    volumes:
      - ../platform/openbao/khoi-tao.sh:/khoi-tao.sh:ro
      - ../.data/openbao:/khoa
      - bimat:/run/bimat
    depends_on:
      openbao:
        condition: service_healthy
    restart: "no"

  postgres:
    # PostgreSQL 17 + PostGIS + pgSTAC trong một image chính thức của stac-utils (có arm64).
    image: ghcr.io/stac-utils/pgstac:${PGSTAC_TAG:-v0.10.0}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=1GB"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nen_tang
      POSTGRES_PASSWORD_FILE: /run/bimat/postgres
    volumes:
      - pg-du-lieu:/var/lib/postgresql/data
      - ../platform/postgres/100_nen_tang.sh:/docker-entrypoint-initdb.d/100_nen_tang.sh:ro
      - ../platform/postgres/110_postgraphile.sh:/docker-entrypoint-initdb.d/110_postgraphile.sh:ro
      - bimat:/run/bimat:ro
    depends_on:
      openbao-khoi-tao:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nen_tang"]
      interval: 3s
      retries: 40

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_TAG:-26.8.1}
    entrypoint:
      - /bin/bash
      - -c
      - >-
        export KC_DB_PASSWORD="$$(cat /run/bimat/keycloak-db)"
        KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/bimat/keycloak-admin)"
        KC_CLIENT_SECRET_KIEM_THU="$$(cat /run/bimat/kc-kiem-thu)"
        KC_CLIENT_SECRET_KIEM_THU_QUAN_TRI="$$(cat /run/bimat/kc-kiem-thu-quan-tri)"
        && exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:${GATEWAY_PORT:-9080}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../platform/keycloak/realm-dxos.json:/opt/keycloak/data/import/realm-dxos.json:ro
      - bimat:/run/bimat:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 60

  postgraphile:
    build: ../platform/postgraphile
    image: carbonfarm/postgraphile:5.1.5
    environment:
      JWKS_URL: http://keycloak:8080/auth/realms/dxos/protocol/openid-connect/certs
      JWT_ISSUER: http://localhost:${GATEWAY_PORT:-9080}/auth/realms/dxos
      GRAPHQL_SCHEMAS: nen_tang
    volumes:
      - bimat:/run/bimat:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null --header='Content-Type: application/json'
          --post-data='{"query":"{__typename}"}' http://127.0.0.1:5678/graphql || exit 1
      interval: 3s
      retries: 40

  apisix:
    image: apache/apisix:${APISIX_TAG:-3.19.0-debian}
    environment:
      APISIX_STAND_ALONE: "true"
    volumes:
      - ../platform/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../platform/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-9080}:9080"
    depends_on:
      keycloak:
        condition: service_healthy
      postgraphile:
        condition: service_healthy

volumes:
  bao-du-lieu:
  bimat:
  pg-du-lieu:
