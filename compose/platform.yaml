# Tầng 1 – dịch vụ lõi tổng quát, không chứa nghiệp vụ. Image gốc, ghim phiên bản; giấy phép ở DEPENDENCIES.md.
# Thứ tự khởi động: openbao → openbao-khoi-tao (sinh bí mật ra volume bimat) → postgres → keycloak → apisix.
# Mật khẩu dịch vụ không nằm trong .env: OpenBao sinh và giữ, dịch vụ đọc qua tệp /run/bimat/<tên>.
services:
  openbao:
    image: openbao/openbao:${OPENBAO_TAG:-2.7.2}
    command: ["server", "-config=/openbao/cau-hinh/config.hcl"]
    volumes:
      - ../platform/openbao/config.hcl:/openbao/cau-hinh/config.hcl:ro
      - bao-du-lieu:/openbao/file
    ports:
      - "127.0.0.1:${OPENBAO_PORT:-8200}:8200"   # UI quản trị, chỉ máy dev
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200 || exit 1"]
      interval: 3s
      retries: 30

  openbao-khoi-tao:
    image: openbao/openbao:${OPENBAO_TAG:-2.7.2}
    entrypoint: ["/bin/sh", "/khoi-tao.sh"]
    user: "0"   # chỉ dịch vụ chạy một lần này ghi volume bimat; dịch vụ khác mount chỉ đọc
    environment:
      BAO_ADDR: http://openbao:8200
    volumes:
      - ../platform/openbao/khoi-tao.sh:/khoi-tao.sh:ro
      - ../.data/openbao:/khoa
      - bimat:/run/bimat
    depends_on:
      openbao:
        condition: service_healthy
    restart: "no"

  postgres:
    # PostgreSQL 17 + PostGIS + pgSTAC trong một image chính thức của stac-utils (có arm64).
    image: ghcr.io/stac-utils/pgstac:${PGSTAC_TAG:-v0.10.0}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=1GB"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nen_tang
      POSTGRES_PASSWORD_FILE: /run/bimat/postgres
    volumes:
      - pg-du-lieu:/var/lib/postgresql/data
      - ../platform/postgres/100_nen_tang.sh:/docker-entrypoint-initdb.d/100_nen_tang.sh:ro
      - ../platform/postgres/110_postgraphile.sh:/docker-entrypoint-initdb.d/110_postgraphile.sh:ro
      - ../platform/postgres/120_prefect.sh:/docker-entrypoint-initdb.d/120_prefect.sh:ro
      - ../platform/postgres/999_zz_stac.sh:/docker-entrypoint-initdb.d/999_zz_stac.sh:ro
      - bimat:/run/bimat:ro
    depends_on:
      openbao-khoi-tao:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nen_tang"]
      interval: 3s
      retries: 40

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_TAG:-26.8.1}
    entrypoint:
      - /bin/bash
      - -c
      - >-
        export KC_DB_PASSWORD="$$(cat /run/bimat/keycloak-db)"
        KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/bimat/keycloak-admin)"
        KC_CLIENT_SECRET_KIEM_THU="$$(cat /run/bimat/kc-kiem-thu)"
        KC_CLIENT_SECRET_KIEM_THU_QUAN_TRI="$$(cat /run/bimat/kc-kiem-thu-quan-tri)"
        && exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:${GATEWAY_PORT:-9080}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../platform/keycloak/realm-dxos.json:/opt/keycloak/data/import/realm-dxos.json:ro
      - bimat:/run/bimat:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 60

  postgraphile:
    build: ../platform/postgraphile
    image: carbonfarm/postgraphile:5.1.5
    environment:
      JWKS_URL: http://keycloak:8080/auth/realms/dxos/protocol/openid-connect/certs
      JWT_ISSUER: http://localhost:${GATEWAY_PORT:-9080}/auth/realms/dxos
      GRAPHQL_SCHEMAS: nen_tang
    volumes:
      - bimat:/run/bimat:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null --header='Content-Type: application/json'
          --post-data='{"query":"{__typename}"}' http://127.0.0.1:5678/graphql || exit 1
      interval: 3s
      retries: 40

  s3:
    # Versity S3 Gateway: API S3 trên thư mục POSIX. Chỉ trong mạng nội bộ (chữ ký SigV4 gắn đường dẫn, không đi qua
    # gateway); dịch vụ Tầng 1/2 và TiTiler gọi trực tiếp. Bucket mặc định: anh-ve-tinh.
    image: versity/versitygw:${VERSITYGW_TAG:-v1.10.0}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /du-lieu/anh-ve-tinh &&
        exec /usr/local/bin/versitygw --access "$$(cat /run/bimat/s3-truy-cap)" --secret "$$(cat /run/bimat/s3-bi-mat)"
        --port :7070 --health /suc-khoe posix /du-lieu
    volumes:
      - s3-du-lieu:/du-lieu
      - bimat:/run/bimat:ro
    depends_on:
      openbao-khoi-tao:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7070/suc-khoe || exit 1"]
      interval: 3s
      retries: 30

  stac:
    # API STAC (danh mục ảnh vệ tinh) trên pgSTAC, có Transactions để thêm collection/item. Qua gateway /stac (JWT).
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:${STAC_FASTAPI_TAG:-7.2.0}
    command:
      - /bin/sh
      - -c
      - >-
        export PGPASSWORD="$$(cat /run/bimat/stac-db)" &&
        exec uvicorn stac_fastapi.pgstac.app:create_app --factory --host 0.0.0.0 --port 8080
    environment:
      PGUSER: stac
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: nen_tang
      ENABLE_TRANSACTIONS_EXTENSIONS: "TRUE"
      UVICORN_ROOT_PATH: /stac
    volumes:
      - bimat:/run/bimat:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/_mgmt/ping')"]
      interval: 3s
      retries: 40

  tiles:
    # TiTiler: tile ảnh COG (đọc từ S3 nội bộ) cho bản đồ. Qua gateway /tiles (JWT).
    image: ghcr.io/developmentseed/titiler:${TITILER_TAG:-2.4.0}
    command:
      - /bin/sh
      - -c
      - >-
        export AWS_ACCESS_KEY_ID="$$(cat /run/bimat/s3-truy-cap)" AWS_SECRET_ACCESS_KEY="$$(cat /run/bimat/s3-bi-mat)" &&
        exec gunicorn -k uvicorn.workers.UvicornWorker titiler.application.main:app --bind 0.0.0.0:8000 --workers 1
    environment:
      AWS_S3_ENDPOINT: s3:7070
      AWS_HTTPS: "NO"
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_REGION: us-east-1
      TITILER_API_ROOT_PATH: /tiles
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
    volumes:
      - bimat:/run/bimat:ro
    depends_on:
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 3s
      retries: 40

  prefect:
    # Prefect server: workflow engine, trạng thái lưu PostgreSQL. API qua gateway /workflow (JWT); UI quản trị chỉ 127.0.0.1.
    image: prefecthq/prefect:${PREFECT_TAG:-3.9.0-python3.12}
    command:
      - /bin/sh
      - -c
      - >-
        export PREFECT_API_DATABASE_CONNECTION_URL="postgresql+asyncpg://prefect:$$(cat /run/bimat/prefect-db)@postgres:5432/prefect" &&
        exec prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_UI_API_URL: http://localhost:${PREFECT_PORT:-4200}/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:${PREFECT_PORT:-4200}:4200"   # UI quản trị, chỉ máy dev
    volumes:
      - bimat:/run/bimat:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')"]
      interval: 3s
      retries: 60

  prefect-chay-mau:
    # Tiến trình đăng ký và thực thi deployment mẫu xu-ly-co-duyet/mau (flow tổng quát có bước chờ duyệt).
    image: prefecthq/prefect:${PREFECT_TAG:-3.9.0-python3.12}
    command: ["python", "/flows/xu_ly_co_duyet.py"]
    environment:
      PREFECT_API_URL: http://prefect:4200/api
    volumes:
      - ../platform/prefect/flows:/flows:ro
    depends_on:
      prefect:
        condition: service_healthy

  apisix:
    image: apache/apisix:${APISIX_TAG:-3.19.0-debian}
    environment:
      APISIX_STAND_ALONE: "true"
    volumes:
      - ../platform/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../platform/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-9080}:9080"
    depends_on:
      keycloak:
        condition: service_healthy
      postgraphile:
        condition: service_healthy
      stac:
        condition: service_healthy
      tiles:
        condition: service_healthy
      prefect:
        condition: service_healthy

volumes:
  bao-du-lieu:
  bimat:
  pg-du-lieu:
  s3-du-lieu:
