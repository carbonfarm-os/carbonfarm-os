# Tầng 2 – miền tín chỉ carbon. Chỉ gọi lõi qua gateway; route gateway khai ở domains/carbon/gateway/routes.yaml.
services:
  web:
    build: ../domains/carbon/web
    image: carbonfarm/carbon-web:0.0.0
    environment:
      ORIGIN: http://localhost:${GATEWAY_PORT:-9080}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 3s
      retries: 30

  carbon-nguoi-dung:
    # Nạp người dùng mẫu của miền (cán bộ, 2 xã viên) vào realm dxos – chạy một lần, chạy lại không sao.
    image: quay.io/keycloak/keycloak:${KEYCLOAK_TAG:-26.8.1}
    entrypoint: ["/bin/bash", "/nap-nguoi-dung.sh"]
    environment:
      KC_ADMIN_USER: ${KC_ADMIN_USER:-admin}
    volumes:
      - ../domains/carbon/keycloak/nap-nguoi-dung.sh:/nap-nguoi-dung.sh:ro
      - ../domains/carbon/keycloak/nguoi-dung-mau.json:/nguoi-dung-mau.json:ro
      - bimat:/run/bimat:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  carbon-mrv:
    # MRV engine: phục vụ deployment Prefect mrv-lo-dat/carbon + cầu nối CSDL ↔ Prefect (domains/carbon/mrv).
    # Cần Internet để đọc danh mục STAC Earth Search và ảnh Sentinel-2 (COG công khai). Cấp tín chỉ qua Registry mock.
    build: ../domains/carbon/mrv
    image: carbonfarm/carbon-mrv:0.0.0
    environment:
      PREFECT_API_URL: http://prefect:4200/api
    volumes:
      - ../methodology:/phuong-phap:ro
      - bimat:/run/bimat:ro
    depends_on:
      prefect:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      stac:
        condition: service_healthy
      s3:
        condition: service_healthy
      dolt:
        condition: service_healthy
      ket-noi-registry:
        condition: service_healthy
      ket-noi-buyer:
        condition: service_healthy
      ket-noi-bank:
        condition: service_healthy

  carbon-kiem-chung:
    # API kiểm chứng công khai (chỉ đọc sổ cái bằng tài khoản so_cai_doc). Qua gateway /kiem-chung/api/* không cần JWT,
    # có giới hạn tần suất (domains/carbon/gateway/routes.yaml). Dùng lại image MRV (đã có PyMySQL).
    image: carbonfarm/carbon-mrv:0.0.0
    command: ["python", "-m", "mrv.kiem_chung"]
    volumes:
      - bimat:/run/bimat:ro
    depends_on:
      carbon-mrv:
        condition: service_started
      dolt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/suc-khoe')"]
      interval: 3s
      retries: 30

  metabase:
    # Dashboard Metabase OSS (AGPL-3.0, dịch vụ riêng, image gốc, KHÔNG dùng metabase-enterprise). CSDL nội bộ H2 trong
    # volume riêng; đọc dữ liệu bằng vai chỉ đọc carbon_bao_cao. UI cho quản trị/cán bộ chỉ mở ở 127.0.0.1.
    image: metabase/metabase:${METABASE_TAG:-v0.64.3}
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      MB_SITE_LOCALE: vi
    ports:
      - "127.0.0.1:${METABASE_PORT:-3001}:3000"
    volumes:
      - metabase-du-lieu:/metabase-data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 5s
      retries: 60
      start_period: 30s

  metabase-dung-dashboard:
    # Chạy một lần: cài đặt Metabase, nối CSDL báo cáo, dựng dashboard (domains/carbon/dashboard). Chạy lại không trùng.
    image: python:3.12.12-slim-bookworm
    command: ["python", "/dashboard/dung_dashboard.py"]
    volumes:
      - ../domains/carbon/dashboard:/dashboard:ro
      - bimat:/run/bimat:ro
    depends_on:
      metabase:
        condition: service_healthy
    restart: "no"

volumes:
  metabase-du-lieu:
