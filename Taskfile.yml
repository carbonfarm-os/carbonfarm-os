# Lệnh của dự án, chạy bằng go-task (https://taskfile.dev, MIT): `task --list` để xem.
version: "3"

vars:
  COMPOSE: docker compose --env-file .env -f compose.yaml
  HURL: ghcr.io/orange-opensource/hurl:7.0.0

tasks:
  default:
    cmds:
      - task --list

  up:
    desc: Chạy Tầng 1 (platform) và Tầng 2 (carbon) bằng Docker Compose
    preconditions:
      - sh: test -f .env
        msg: "Thiếu .env — chạy: cp .env.example .env"
    cmds:
      - mkdir -p .data/openbao
      - "{{.COMPOSE}} up -d --wait"

  down:
    desc: Dừng mọi dịch vụ, giữ volume
    cmds:
      - "{{.COMPOSE}} down"

  seed:
    desc: Nạp dữ liệu GIẢ (hợp tác xã, xã viên, lô đất mẫu ở khu rừng ngập mặn mẫu)
    cmds:
      - echo "Chưa có dữ liệu mẫu — làm ở issue tuần 2 (domains/carbon/seed/)"

  smoke:
    desc: Kiểm thử đầu-cuối bằng Hurl (chạy trong Docker, cùng mạng compose) trên hệ thống đang chạy
    cmds:
      - >-
        docker run --rm --network carbonfarm_default -v "{{.ROOT_DIR}}/tests/e2e:/e2e:ro" {{.HURL}}
        --test --variables-file /e2e/compose.env
        --variable kc_secret="$({{.COMPOSE}} exec -T keycloak cat /run/bimat/kc-kiem-thu)"
        --variable kc_secret_qt="$({{.COMPOSE}} exec -T keycloak cat /run/bimat/kc-kiem-thu-quan-tri)"
        --variable s3_truy_cap="$({{.COMPOSE}} exec -T s3 cat /run/bimat/s3-truy-cap)"
        --variable s3_bi_mat="$({{.COMPOSE}} exec -T s3 cat /run/bimat/s3-bi-mat)"
        --file-root /e2e
        --glob '/e2e/*.hurl'

  check:
    desc: Trước mọi PR — SPDX mọi tệp + compose hợp lệ
    cmds:
      - python3 scripts/spdx.py check
      - docker compose --env-file .env.example -f compose.yaml config --quiet
      - 'echo "OK – compose hợp lệ"'

  lint:
    desc: Lint YAML, Python, shell (công cụ cài bằng pixi hoặc pip)
    cmds:
      - yamllint -s .
      - ruff check .

  license:
    desc: Thêm header SPDX cho tệp mới
    cmds:
      - python3 scripts/spdx.py fix
