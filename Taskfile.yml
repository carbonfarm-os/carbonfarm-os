# Lệnh của dự án, chạy bằng go-task (https://taskfile.dev, MIT): `task --list` để xem.
version: "3"

vars:
  COMPOSE: docker compose --env-file .env -f compose.yaml
  HURL: ghcr.io/orange-opensource/hurl:7.0.0

tasks:
  default:
    cmds:
      - task --list

  up:
    desc: Chạy Tầng 1 (platform) và Tầng 2 (carbon) bằng Docker Compose
    preconditions:
      - sh: test -f .env
        msg: "Thiếu .env — chạy: cp .env.example .env"
    cmds:
      - mkdir -p .data/openbao
      - "{{.COMPOSE}} up -d --wait"

  down:
    desc: Dừng mọi dịch vụ, giữ volume
    cmds:
      - "{{.COMPOSE}} down"

  seed:
    desc: Nạp dữ liệu GIẢ (hợp tác xã, xã viên, lô đất mẫu ở khu rừng ngập mặn mẫu)
    cmds:
      - echo "Chưa có dữ liệu mẫu — làm ở issue tuần 2 (domains/carbon/seed/)"

  smoke:
    desc: "Kiểm thử đầu-cuối – Hurl (trong Docker, cùng mạng compose; localhost:9080 trỏ tới apisix) + kiểm thử tích hợp Python"
    cmds:
      # Bí mật do OpenBao sinh → tệp biến tạm trong .data/ (ngoài git), xóa ngay sau khi chạy
      - defer: rm -f .data/smoke-bimat.env
      - >-
        {{.COMPOSE}} exec -T keycloak sh -c
        'for f in /run/bimat/*; do printf "bm_%s=%s\n" "$(basename $f | tr - _)" "$(cat $f)"; done'
        > .data/smoke-bimat.env
      - >-
        docker run --rm --network carbonfarm_default
        -v "{{.ROOT_DIR}}/tests/e2e:/e2e:ro" -v "{{.ROOT_DIR}}/.data/smoke-bimat.env:/bimat.env:ro" {{.HURL}}
        --test --jobs 1 --variables-file /e2e/compose.env --variables-file /bimat.env
        --connect-to localhost:9080:apisix:9080 --file-root /e2e --glob '/e2e/*.hurl'
      - python3 -m unittest discover -s tests/tich-hop -v

  check:
    desc: Trước mọi PR — SPDX mọi tệp + compose hợp lệ
    cmds:
      - python3 scripts/spdx.py check
      - docker compose --env-file .env.example -f compose.yaml config --quiet
      - 'echo "OK – compose hợp lệ"'

  test:
    desc: "Kiểm thử không cần hệ thống chạy: công thức phương pháp MRV, hợp đồng OpenAPI của connector khớp mã"
    cmds:
      - python3 -m unittest discover -s domains/carbon/mrv/tests -v
      - python3 -m connectors.xuat_openapi --kiem

  openapi:
    desc: Sinh lại hợp đồng OpenAPI connectors/<tên>/openapi.yaml từ mã (cần fastapi – connectors/requirements.txt)
    cmds:
      - python3 -m connectors.xuat_openapi

  lint:
    desc: Lint YAML, Python, shell (công cụ cài bằng pixi hoặc pip)
    cmds:
      - yamllint -s .
      - ruff check .

  license:
    desc: Thêm header SPDX cho tệp mới
    cmds:
      - python3 scripts/spdx.py fix
